name: "CodeQL"

permissions: {}

on:
  push:
    branches: [ '*' ]
  schedule:
    - cron: '20 17 * * 1'

jobs:
  analyze:
    name: CodeQL analysis for ${{ matrix.language }}
    permissions:
      actions: read  # Required to run CodeQL analysis
      contents: read  # Required to access repository contents for analysis
      security-events: write  # Required to upload analysis results to pull requests
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    uses: UBC-MOAD/gha-workflows/.github/workflows/codeql-analysis.yaml@main  # zizmor: ignore[unpinned-uses]
    with:
      language: ${{ matrix.language }}
